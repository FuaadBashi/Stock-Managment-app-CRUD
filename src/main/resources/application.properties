spring.application.name=stock-management

# In-memory database so the API runs with no setup. Point these at a real
# database (for example PostgreSQL) for persistent data.
spring.datasource.url=jdbc:h2:mem:stock;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console while running.
spring.h2.console.enabled=true

spring.application.name=stock-management
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/stock;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.user.name=${APP_USERNAME:admin}
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.security.user.password=${APP_PASSWORD:}
